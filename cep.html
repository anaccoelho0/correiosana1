<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <link rel="stylesheet" href="style.css">
</head>

<nav>
    <ul id="MenuItens">
        <li><a href=""title="">Enviar</a></li>
        <li><a href=""title="">Receber</a></li>
        <li><a href=""title="">Comprar</a></li>
        <li><a href=""title="">Logística</a></li>
        <li><a href=""title="">Atendimento</a></li>
    </ul>
</nav>
<body>
    <div class="imagem-central">
        <img src="correios.jpg" alt="Logo dos Correios" class="imagem-correios">
    </div>

    <div class="container">
        <div class="conteudo">
            <h1>Consulta de CEP</h1>
            <label>Digite o CEP:</label>
            <input type="text" id="cepInput">
            <button onclick="buscarEndereco()">Buscar</button>
            <div id="endereco"></div>
        </div>
    </div>

    <script>
        function buscarEndereco() {
            var cep = document.getElementById('cepInput').value;
            var url = `https://viacep.com.br/ws/${cep}/json/`;
            
            fetch(url)
            .then(response => response.json())
            .then(data => {
                if(data.erro) {
                    document.getElementById('endereco').innerText = "CEP não encontrado.";
                } else {
                    var endereco = `CEP: ${data.cep}, ${data.logradouro}, ${data.bairro}, ${data.localidade}, ${data.uf}`;
                    document.getElementById('endereco').innerText = endereco;
                }
            })
            .catch(error => console.error('Erro:', error));
        }
    </script>
</body>
</html>
